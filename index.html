</style></head><body><main class="app">
<header><h1>怪角對戰</h1><div><b id="tickets">抽卡券 1</b><div class="meta" id="count">收藏 3 / 20</div></div></header>
<nav id="nav"><button data-page="home" class="active">打架</button><button data-page="draw">抽角色</button><button data-page="collection">收藏</button></nav>
<section id="home" class="screen"><div class="stage"><span class="stage-label">三位，上場。</span><canvas id="homeCanvas" width="600" height="320" aria-label="目前三隻隊伍角色"></canvas></div><div class="team" id="homeTeam"></div><p class="help">點隊伍位置，再去收藏換人。每場帶 3 隻，場上 1 隻。</p><button id="start" class="wide">開始打架</button><div class="strip"><b>打、跳、必殺。</b><div class="meta">掃地就跳，抓空留地上。綠色空檔再揍，連打時來不及收拳。</div></div><div class="status" id="saveStatus">進度自動儲存。</div></section>
<section id="collection" class="screen" hidden><h2>角色收藏</h2><p class="help" id="slotHint"></p><div id="detail"></div><div id="cards" class="cards"></div></section>
<section id="draw" class="screen" hidden><h2>紙箱裡有什麼</h2><div class="drawstage"><canvas id="drawCanvas" width="600" height="320" aria-label="抽卡紙箱和抽出的角色"></canvas><h3 id="drawName">尚未拆箱</h3><p id="drawDesc">一次一張券。</p></div><button id="pull" class="wide">拆一箱 · 1 張券</button><p class="odds">N 50% · R 30% · SR 16% · SSR 4%<br>重複角色：EXP +45。連續 7 箱沒新角色，第 8 箱必出未收藏角色（全收齊後除外）。</p></section>
<section id="battle" class="screen" hidden><div class="battleclock"><b id="clock"></b><span>綠色空檔才好打</span></div><div class="hud"><div><div class="hud-name" id="pname"></div><div class="hp"><i id="php"></i></div><div class="hpnum" id="pnum"></div></div><div><div class="hud-name" id="ename"></div><div class="hp enemyhp"><i id="ehp"></i></div><div class="hpnum" id="enum"></div></div></div><div id="cue" class="battlecue" aria-live="polite">準備</div><div class="stage"><canvas id="battleCanvas" width="600" height="320" aria-label="戰鬥畫面"></canvas></div><div class="team" id="battleTeam"></div><div class="controls"><button id="hit">打<small>可按住連打</small></button><button id="jump">跳<small>躲地面攻擊</small></button><button id="special">必殺<small id="chargeText">集氣</small><div class="charge"><i id="chargeBar"></i></div></button></div><div class="battlebar"><button id="pause">暫停</button><button id="sound">音效：開</button><button id="leave">離場</button></div></section>
<div class="footer">怪角對戰 v1.3</div></main>
<div id="overlay" class="backdrop" hidden><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><div id="modalBody"></div><button id="modalAction"></button></div></div><div id="toast" role="status" hidden></div>
<script>
'use strict';
// Every combat timer advances on one game clock. No delayed damage callbacks survive a battle.

{id:'nose',name:'鼻毛拳王',rarity:'N',hp:155,atk:14,speed:.47,jump:1,skill:'鼻毛拖吊',desc:'鼻毛伸出去，把人拖回來。',weak:'鼻毛收回去時，整個人都在發呆。',kind:'stun'},
{id:'egg',name:'半熟荷包蛋',rarity:'N',hp:130,atk:13,speed:.43,jump:1.05,skill:'蛋黃離職',desc:'蛋黃砸下去。蛋白留在原地。',weak:'蛋白很薄，從上面砸會更痛。',kind:'slam'},
{id:'sausage',name:'長腿香腸',rarity:'R',hp:120,atk:16,speed:.48,jump:1.12,skill:'腿沒有盡頭',desc:'腳一直伸長。到底要去哪。',weak:'腿太長，攻擊完收很久。',kind:'kick'},

{id:'roach',name:'三樓蟑螂主任',rarity:'N',hp:115,atk:9,speed:.29,jump:1.22,skill:'全樓層集合',desc:'十二隻。沒有一隻有在上班。',weak:'其實血很少。',kind:'swarm'},
{id:'printer',name:'公司印表機',rarity:'SSR',hp:190,atk:12,speed:.4,jump:.92,skill:'請勿重複列印',desc:'紙越吐越多，事情沒有變少。',weak:'連續被打四下，會當機。',kind:'paper'},
{id:'monday',name:'禮拜一',rarity:'SR',hp:145,atk:18,speed:.57,jump:1,skill:'不想上班',desc:'整個畫面灰掉，對方動作變慢。',weak:'攻擊準備很久，跳就對了。',kind:'slow'},
{id:'aunt',name:'市場殺價阿姨',rarity:'SR',hp:175,atk:13,speed:.45,jump:1,skill:'再便宜一點',desc:'把對方攻擊力砍到六折。',weak:'每次打完，都還要再講兩句。',kind:'bargain'},
{id:'wifi',name:'Wi-Fi 分享器',rarity:'R',hp:125,atk:12,speed:.37,jump:1.15,skill:'訊號剩一格',desc:'對方卡住。你可以繼續打。',weak:'插頭一鬆就不行，反擊特別痛。',kind:'lag'},
{id:'bag',name:'塑膠袋戰士',rarity:'N',hp:135,atk:11,speed:.35,jump:1.2,skill:'袋子套袋子',desc:'套住對手，順便喘口氣補血。',weak:'輕飄飄的，空中攻擊很有效。',kind:'heal'},
{id:'chin',name:'超長下巴哥',rarity:'SR',hp:165,atk:22,speed:.72,jump:.95,skill:'下巴先到',desc:'人還沒動，下巴已經過去了。',weak:'下巴會卡地板，出手後很好打。',kind:'chin'},
{id:'slipper',name:'失蹤左拖鞋',rarity:'N',hp:142,atk:14,speed:.43,jump:1.08,skill:'右腳出門找人',desc:'三隻右拖鞋飛出去。左邊還是沒找到。',weak:'鞋底太薄。',kind:'slippers'},
{id:'radish',name:'穿褲子的蘿蔔',rarity:'N',hp:175,atk:12,speed:.5,jump:.92,skill:'褲頭彈射',desc:'褲子飛走，蘿蔔本人補回 30 HP。',weak:'褲頭很鬆。',kind:'pants'},
{id:'umbrella',name:'漏水雨傘',rarity:'R',hp:130,atk:13,speed:.37,jump:1.18,skill:'下雨只淋你',desc:'八滴超大雨滴，只落在對手身上。',weak:'本人不防水。',kind:'rain'},
{id:'rice',name:'不爽的電鍋',rarity:'R',hp:210,atk:19,speed:.7,jump:.9,skill:'保溫到天荒',desc:'噴蒸氣，鍋蓋保護自己 3 秒。',weak:'煮飯很慢，出拳也慢。',kind:'steam'},
{id:'banana',name:'社區香蕉伯',rarity:'SR',hp:125,atk:17,speed:.45,jump:1.16,skill:'皮比本人有用',desc:'丟香蕉皮，讓對手滑倒露出空檔。',weak:'很容易被剝。',kind:'peel'},
{id:'clock',name:'延遲鬧鐘',rarity:'SR',hp:150,atk:15,speed:.5,jump:1.05,skill:'再睡五分鐘',desc:'先拖慢動作，過一下才突然響。',weak:'出手永遠晚半拍。',kind:'alarm'},
{id:'receipt',name:'發票長老',rarity:'SSR',hp:160,atk:11,speed:.32,jump:1.12,skill:'沒中也有聲音',desc:'號碼轉起來，這次傷害有大有小。',weak:'折起來就很小。',kind:'lottery'},
{id:'durian',name:'懸浮榴槤大師',rarity:'SSR',hp:135,atk:23,speed:.72,jump:1.25,skill:'聞到就算打中',desc:'臭氣持續傷害，讓對手 4 秒守不住。',weak:'皮很硬，身體倒是很脆。',kind:'stink'},
{id:'wu',name:'吳宗諺魔王',rarity:'BOSS',hp:205,atk:19,speed:.58,jump:1,skill:'哈哈哈哈哈',desc:'頭變超大，笑到地板裂開。',weak:'笑完會喘。趁那時候揍他。',kind:'laugh'}
];
// Opponents are separate characters, with distinct timing, silhouettes and attack sequences.
const ENEMIES=[
{id:'signal',name:'黃燈超時阿伯',hp:490,atk:47,drop:'aunt',guard:.12,recover:1.6,weak:'紅燈揍他會被罰。等綠燈。',signature:'闖紅燈罰單'},
{id:'mop',name:'拖把頭巡邏員',hp:510,atk:45,drop:'bag',guard:.24,recover:1.5,weak:'拖完兩下還要擦玻璃。等全部做完。',signature:'拖完還要擦玻璃'},
{id:'pigeon',name:'鴿子保全',hp:430,atk:50,drop:'roach',guard:.24,recover:1.65,weak:'休息時還在半空中，要跳起來揍。',signature:'巡邏不用走路'},
{id:'stapler',name:'訂書機螃蟹',hp:530,atk:48,drop:'toilet',guard:.08,recover:1.6,weak:'鉗子收起來之前，打它會被夾。',signature:'先夾再裝沒事'},
{id:'fridge',name:'冷凍庫房東',hp:550,atk:44,drop:'printer',guard:.28,recover:1.4,weak:'偷喝冰水會回血，趁喝水時連打打斷。',signature:'押金不退，血要補'},
{id:'noodle',name:'九層麵條怪',hp:480,atk:46,drop:'sausage',guard:.25,recover:1.5,weak:'最後一根麵才是真的。被綁會掉集氣。',signature:'麵條打結'},
{id:'bin',name:'垃圾桶健身教練',hp:560,atk:48,drop:'nose',guard:.2,recover:1.6,weak:'一組三下，最後一下特別重。',signature:'再做最後一組'},
{id:'fan',name:'電風扇八腳王',hp:460,atk:47,drop:'wifi',guard:.25,recover:1.5,weak:'起風時跳得比較低，別太早跳。',signature:'強風三級'}
];
const enemyById=id=>ENEMIES.find(c=>c.id===id)||ROSTER.find(c=>c.id===id);
const move=(kind,name,windup=.75,power=1)=>({kind,name,windup,power});
const byId=id=>ROSTER.find(c=>c.id===id), $=id=>document.getElementById(id), KEY='weird-duel-v1';
const fresh=()=>({version:1,tickets:1,owned:{nose:{lv:1,xp:0},egg:{lv:1,xp:0},sausage:{lv:1,xp:0}},team:['nose','egg','sausage'],wins:0,pity:0,lastOpponent:null,sound:true});
let save=fresh(),storageOK=true;
try{const raw=JSON.parse(localStorage.getItem(KEY));if(raw&&raw.version===1){const clean=fresh();clean.owned={};for(const c of ROSTER){const v=raw.owned?.[c.id];if(v&&Number.isFinite(v.lv)&&Number.isFinite(v.xp))clean.owned[c.id]={lv:Math.max(1,Math.min(30,Math.floor(v.lv))),xp:Math.max(0,Math.floor(v.xp))};}for(const id of ['nose','egg','sausage'])clean.owned[id]??={lv:1,xp:0};clean.team=[...new Set((Array.isArray(raw.team)?raw.team:[]).filter(id=>clean.owned[id]))].slice(0,3);for(const id of Object.keys(clean.owned)){if(clean.team.length===3)break;if(!clean.team.includes(id))clean.team.push(id)}clean.tickets=Number.isFinite(raw.tickets)?Math.max(0,Math.floor(raw.tickets)):1;clean.wins=Math.max(0,Math.floor(raw.wins)||0);clean.pity=Math.max(0,Math.floor(raw.pity)||0);clean.lastOpponent=typeof raw.lastOpponent==='string'?raw.lastOpponent:null;clean.sound=raw.sound!==false;save=clean}}catch(e){storageOK=false}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));storageOK=true}catch(e){storageOK=false}$('saveStatus').textContent=storageOK?'進度自動儲存。':'這個瀏覽器無法儲存，關閉後進度可能消失。'}
function stats(c,lv){return {hp:c.hp+(lv-1)*7,atk:c.atk+(lv-1)*1.1}}
function addXP(id,n){const v=save.owned[id];v.xp+=n;let ups=0;while(v.lv<30&&v.xp>=35+v.lv*15){v.xp-=35+v.lv*15;v.lv++;ups++}if(v.lv===30)v.xp=0;return ups}
let page='home',selectedSlot=0,detailId='nose',b=null,drawState=null,toastTime=0,hold=false,holdTimer=0,modalCallback=null,ac=null;
function toast(s){$('toast').textContent=s;$('toast').hidden=false;toastTime=2.4}
function sound(freq=180,duration=.07,type='square'){if(!save.sound)return;try{ac??=new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(freq,ac.currentTime);o.frequency.exponentialRampToValueAtTime(Math.max(35,freq*.45),ac.currentTime+duration);g.gain.setValueAtTime(.045,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+duration);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+duration)}catch(e){}}
function modal(title,body,label,fn){hold=false;modalCallback=fn;$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalAction').textContent=label;$('overlay').hidden=false;$('modalAction').focus()}
$('modalAction').onclick=()=>{$('overlay').hidden=true;const fn=modalCallback;modalCallback=null;fn?.()};
function setPage(p){if(b?.running)return;page=p;for(const el of document.querySelectorAll('.screen'))el.hidden=el.id!==p;for(const btn of document.querySelectorAll('nav button'))btn.classList.toggle('active',btn.dataset.page===p);$('nav').hidden=p==='battle';refresh()}
document.querySelectorAll('nav button').forEach(btn=>btn.onclick=()=>setPage(btn.dataset.page));
function mini(canvas,id){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);paintCharacter(ctx,byId(id),canvas.width/2,canvas.height*.86,canvas.width/185,1,0,0)}

function startEnemyMove(){const e=b.enemy,m=e.sequence[e.step];e.move=m.kind;e.phase='windup';e.timer=Math.max(.58,m.windup-Math.min(.18,b.danger*.007)-(e.enraged?.05:0));e.phaseTotal=e.timer;e.healDamage=0}

if(!b.running)return;if(s.kind==='alarm'&&s.events===1&&s.t>1.05){s.events=2;label('現在才響？！',310,100,'#b4264e');hit(3.4);sound(800,.2,'sawtooth')}if(!b.running)return;if(['flush','swarm','paper','slippers','rain'].includes(s.kind)){const desired=Math.min(s.kind==='swarm'?12:['paper','rain'].includes(s.kind)?8:s.kind==='slippers'?3:5,s.t<.25?0:Math.floor((s.t-.25)/(s.kind==='slippers'?.38:.14))+1);while(s.events<desired){s.events++;hit(s.kind==='swarm'?.34:s.kind==='paper'?.5:s.kind==='rain'?.42:s.kind==='slippers'?1.05:.7);if(!b.running)break}if(s.kind==='flush')setStun(.18)}if(s.t>=s.duration)b.skill=null}

function paintBattle(t){if(!b)return;const ctx=$('battleCanvas').getContext('2d');ctx.save();if(b.shake>0&&!matchMedia('(prefers-reduced-motion: reduce)').matches)ctx.translate((Math.random()-.5)*7,(Math.random()-.5)*5);background(ctx);const f=player(),e=b.enemy;const lunge=f.attack>0?Math.sin(f.attack/.23*Math.PI)*100:0;const enemyLunge=e.attack>0?Math.sin(e.attack/.24*Math.PI)*130:0;ctx.fillStyle='#0002';ctx.beginPath();ctx.ellipse(155,273,43,7,0,0,Math.PI*2);ctx.ellipse(435,273,45,7,0,0,Math.PI*2);ctx.fill();paintCharacter(ctx,f.c,155+lunge,269-jumpHeight(f),1.05,1,f.hp<=0?1.4:f.hurt>0?-.22:f.jump>0?-.1:Math.sin(t*3)*.025);let ep=e.hp<=0?1.35:['windup','followup'].includes(e.phase)?.13:e.hurt>0?-.24:e.stun>0?Math.sin(t*20)*.06:0;paintEnemy(ctx,e,435-enemyLunge,269,t,ep);if(b.boss&&e.move==='quake'&&['windup','strike'].includes(e.phase)){ctx.fillStyle='#b4264e';ctx.font='bold 35px Arial';ctx.fillText('哈',400+Math.sin(t*20)*15,75)}if(['windup','followup'].includes(e.phase)){ctx.strokeStyle='#e84460';ctx.lineWidth=6;ctx.beginPath();ctx.arc(435,94,22,-Math.PI/2,-Math.PI/2+Math.PI*2*(1-e.timer/e.phaseTotal));ctx.stroke()}if(e.phase==='windup'||e.phase==='followup'){ctx.fillStyle=e.move==='air'&&e.phase!=='followup'?'#3984ee30':'#ff6ca030';ctx.fillRect(70,e.move==='air'&&e.phase!=='followup'?75:246,180,e.move==='air'&&e.phase!=='followup'?145:27)}if(e.attack>0&&e.move==='air'){ctx.strokeStyle='#654098';ctx.lineWidth=13;ctx.beginPath();ctx.moveTo(390,180);ctx.lineTo(160,105);ctx.stroke()}if(e.attack>0&&e.move==='quake'){ctx.strokeStyle='#b4264e';ctx.lineWidth=6;ctx.beginPath();for(let i=0;i<12;i++){const x=65+i*35,y=270-(i%2)*18;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.stroke()}paintEnemyEffect(ctx,e,t);if(f.shield>0){ctx.strokeStyle='#3984ee';ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(155+lunge,215-jumpHeight(f),57,60,0,0,Math.PI*2);ctx.stroke()}if(e.smell>0){ctx.fillStyle='#83a93733';ctx.fillRect(365,150,145,120)}if(b.skill)skillVisual(ctx,b.skill);for(const p of b.fx){
